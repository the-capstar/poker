# Deploys the static PWA to GitHub Pages on every push to main.
# Stamps the commit SHA into sw.js + version.json so phones pick up the new version.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate range JSON
        run: |
          for f in data/ranges/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f'))" || { echo "Invalid JSON: $f"; exit 1; }; done
          node -e "
            import('./js/lib/notation.js').then(async ({ buildStrategy }) => {
              const fs = await import('node:fs');
              const idx = JSON.parse(fs.readFileSync('data/ranges/index.json'));
              for (const f of idx.files) for (const s of JSON.parse(fs.readFileSync('data/ranges/' + f)).spots)
                buildStrategy(s.actions.filter(a => !(s.decoys || []).includes(a)), s.ranges);
              console.log('All range notation parses OK');
            }).catch(e => { console.error(e.message); process.exit(1); });"

      - name: Stamp version
        run: |
          SHA=${GITHUB_SHA::7}
          sed -i "s/const VERSION = 'dev';/const VERSION = '$SHA';/" sw.js
          echo "{ \"version\": \"$SHA\", \"built\": \"$(date -u +%FT%TZ)\" }" > version.json

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js version.json css js data icons _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
